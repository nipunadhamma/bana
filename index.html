<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-700">

  <!-- Header -->
  <header class="bg-white shadow p-4 flex justify-between items-center">
    <button class="focus:outline-none">
      <!-- Hamburger icon -->
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <div id="search-placeholder" class="text-gray-500">Search...</div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-4">

    <!-- Top Stats Section -->
    <section id="top-stats" class="bg-white p-4 rounded shadow">
      <h2 class="text-xl font-semibold mb-2">Top Stats</h2>
      <div id="stats-content">Loading stats...</div>
    </section>

    <!-- Central Content Blocks -->
    <section class="col-span-1 md:col-span-2 grid grid-cols-1 md:grid-cols-3 gap-4">

      <!-- Poya -->
      <div id="poya" class="bg-white p-4 rounded shadow">Loading Poya...</div>

      <!-- Dhamma Vakya -->
      <div id="dhamma-vakya" class="bg-white p-4 rounded shadow">Loading Dhamma Vakya...</div>

      <!-- Day Name -->
      <div id="day-name" class="bg-white p-4 rounded shadow">Loading Day Name...</div>
    </section>

    <!-- Image Gallery -->
    <section id="image-gallery" class="bg-white p-4 rounded shadow aspect-video">
      <h2 class="text-xl font-semibold mb-2">Image Gallery</h2>
      <div id="images" class="w-full h-full flex items-center justify-center">Loading images...</div>
    </section>

    <!-- Video Grid -->
    <section id="video-grid" class="bg-white p-4 rounded shadow aspect-video">
      <h2 class="text-xl font-semibold mb-2">Video</h2>
      <div id="video" class="w-full h-full flex items-center justify-center">Loading video...</div>
    </section>

    <!-- Audio Player -->
    <section id="audio-player" class="bg-white p-4 rounded shadow">
      <h2 class="text-xl font-semibold mb-2">Audio</h2>
      <audio id="audio" controls class="w-full">
        Your browser does not support the audio element.
      </audio>
    </section>

    <!-- Live Clock -->
    <section class="col-span-1 md:col-span-3 bg-white p-4 rounded shadow text-center">
      <h2 class="text-xl font-semibold mb-2">Current Time</h2>
      <div id="clock" class="text-2xl font-mono">Loading time...</div>
    </section>

  </main>

  <!-- JavaScript for dynamic content -->
  <script>
    // Example data object
    const MY_DASHBOARD_DATA = {
      stats: "Total Users: 1234",
      poya: "Poya Date: 15th March",
      dhammaVakya: "Dhamma Vakya: Practice kindness",
      dayName: "Monday",
      images: ["https://via.placeholder.com/600x400"],
      videoUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
      audioSrc: "https://www.w3schools.com/html/horse.mp3"
    };

    function loadDashboardData() {
      document.getElementById('stats-content').textContent = MY_DASHBOARD_DATA.stats;
      document.getElementById('poya').textContent = MY_DASHBOARD_DATA.poya;
      document.getElementById('dhamma-vakya').textContent = MY_DASHBOARD_DATA.dhammaVakya;
      document.getElementById('day-name').textContent = MY_DASHBOARD_DATA.dayName;
      
      // Load image
      const imgContainer = document.getElementById('images');
      imgContainer.innerHTML = `<img src="${MY_DASHBOARD_DATA.images[0]}" alt="Gallery Image" class="w-full h-full object-cover rounded"/>`;

      // Load video
      const videoContainer = document.getElementById('video');
      videoContainer.innerHTML = `<iframe class="w-full h-full" src="${MY_DASHBOARD_DATA.videoUrl}" frameborder="0" allowfullscreen></iframe>`;

      // Load audio
      const audioElement = document.getElementById('audio');
      audioElement.src = MY_DASHBOARD_DATA.audioSrc;
    }

    function updateClock() {
      const clock = document.getElementById('clock');
      setInterval(() => {
        clock.textContent = new Date().toLocaleTimeString();
      }, 1000);
    }

    // Initialize
    window.onload = () => {
      loadDashboardData();
      updateClock();
    };
  </script>
</body>
