<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Canva Mini PRO - STEP 18 CORE</title>

<!-- ================= FABRIC ================= -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

<!-- ================= CSS ================= -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/menu.css">
<link rel="stylesheet" href="css/toolbar.css">
<link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/layers.css">
<link rel="stylesheet" href="css/effects.css">
<link rel="stylesheet" href="css/responsive.css">

<style>
body { margin:0; font-family:Arial; overflow:hidden; }

/* TOP MENU */
#topMenu {
    height: 45px;
    background: #222;
    color: white;
    display: flex;
    align-items: center;
}

.menuItem {
    padding: 10px 15px;
    cursor: pointer;
    position: relative;
}

.menuItem:hover { background:#333; }

.dropdown {
    display:none;
    position:absolute;
    top:45px;
    left:0;
    background:#111;
    min-width:160px;
    z-index:1000;
}

.menuItem:hover .dropdown {
    display:block;
}

.dropdown button {
    width:100%;
    padding:8px;
    background:none;
    border:none;
    color:white;
    cursor:pointer;
}

.dropdown button:hover { background:#333; }

/* LAYOUT */
#main {
    display:flex;
    height: calc(100vh - 45px);
}

/* LEFT */
#leftPanel {
    width:200px;
    background:#eee;
    padding:10px;
}

/* CANVAS */
#canvasArea {
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ddd;
}

/* RIGHT */
#rightPanel {
    width:240px;
    background:#eee;
    padding:10px;
}

/* FLOATING */
.panel {
    position:absolute;
    top:100px;
    left:100px;
    background:white;
    padding:10px;
    border:1px solid #ccc;
    z-index:999;
}

</style>

</head>

<body>

<!-- ================= TOP MENU ================= -->
<div id="topMenu">

    <div class="menuItem">File
        <div class="dropdown">
            <button onclick="newProject()">New</button>
            <button onclick="saveProject()">Save</button>
            <button onclick="openProject()">Open</button>
        </div>
    </div>

    <div class="menuItem">Edit
        <div class="dropdown">
            <button onclick="undo()">Undo</button>
            <button onclick="redo()">Redo</button>
        </div>
    </div>

    <div class="menuItem">Add
        <div class="dropdown">
            <button onclick="addText()">Text</button>
            <button onclick="addRect()">Rect</button>
            <button onclick="addCircle()">Circle</button>
        </div>
    </div>

    <div class="menuItem">View
        <div class="dropdown">
            <button onclick="zoomIn()">Zoom In</button>
            <button onclick="zoomOut()">Zoom Out</button>
        </div>
    </div>

    <div class="menuItem">Effects
        <div class="dropdown">
            <button onclick="addShadow()">Shadow</button>
            <button onclick="addGlow()">Glow</button>
        </div>
    </div>

</div>

<!-- ================= MAIN ================= -->
<div id="main">

    <!-- LEFT -->
    <div id="leftPanel">
        <h3>Assets</h3>
        <h3>Layers</h3>
        <div id="layerList"></div>
    </div>

    <!-- CANVAS -->
    <div id="canvasArea">
        <canvas id="canvas"></canvas>
    </div>

    <!-- RIGHT -->
    <div id="rightPanel">

        <h3>Properties</h3>

        <input type="color" onchange="setColor(this.value)">
        <input type="number" onchange="setFontSize(this.value)">

        <hr>

        <button onclick="lockObject()">Lock</button>
        <button onclick="unlockObject()">Unlock</button>

    </div>

</div>

<!-- ================= FLOATING PANELS ================= -->

<div class="panel" id="effectsPanel">
    <h4>Effects</h4>
    <button onclick="addShadow()">Shadow</button>
</div>

<div class="panel" id="historyPanel">
    <h4>History</h4>
    <div id="historyList"></div>
</div>

<!-- ================= CORE SCRIPTS ================= -->

<script src="js/core/config.js"></script>
<script src="js/core/canvas.js"></script>

<script src="js/engine/layers.js"></script>
<script src="js/engine/effects-engine.js"></script>
<script src="js/engine/crop.js"></script>

<script src="js/tools/shapes.js"></script>
<script src="js/tools/brush.js"></script>

<script src="js/tools/text.js"></script>

<script src="js/features/history.js"></script>
<script src="js/features/export.js"></script>

<script src="js/ui/menu.js"></script>

<script src="js/app.js"></script>
<script src="js/init.js"></script>

</body>
</html>
